<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚡[ СИМФОНИЯ БЕЗУМИЯ — СИНИЙ ЭКРАН ]⚡</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial Black', 'Impact', 'Courier New', monospace;
            background: black;
        }
        .main-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }
        .hyper-header {
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(20px);
            border-bottom: 3px solid #ff00cc;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            pointer-events: auto;
            z-index: 50;
            box-shadow: 0 0 45px #ff00cc;
            animation: borderPulse 0.5s infinite alternate;
        }
        @keyframes borderPulse {
            0% { border-bottom-color: #ff00cc; text-shadow: 0 0 0 pink;}
            100% { border-bottom-color: #00ffff; text-shadow: 0 0 20px cyan;}
        }
        .mad-title {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff00cc, #ffcc00, #00ffcc, #ff00cc);
            background-size: 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 2s infinite;
            letter-spacing: 5px;
        }
        @keyframes gradientMove {
            0% { background-position: 0%;}
            100% { background-position: 300%;}
        }
        .glitch-counter {
            color: #0ff;
            font-family: monospace;
            font-size: 1.3rem;
            background: #000000aa;
            padding: 5px 15px;
            border-radius: 30px;
            border-left: 5px solid magenta;
        }
        .pdf-epicenter {
            flex: 1;
            margin: 40px 60px 50px 60px;
            border-radius: 60px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(25px);
            border: 2px solid white;
            overflow: hidden;
            pointer-events: auto;
            box-shadow: 0 0 80px rgba(0,255,255,0.7), inset 0 0 40px magenta;
            transition: 0.2s;
        }
        .pdf-epicenter:hover {
            transform: scale(1.01);
            border-color: #ff00cc;
            box-shadow: 0 0 150px cyan, inset 0 0 70px yellow;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            border-radius: 56px;
        }
        .hyper-marquee {
            background: black;
            border-top: 2px solid #ff00cc;
            border-bottom: 2px solid #00ffff;
            padding: 8px 0;
            overflow: hidden;
            white-space: nowrap;
            pointer-events: auto;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .marquee-text {
            display: inline-block;
            animation: scrollHyper 12s linear infinite;
            color: #ffcc00;
            text-shadow: 0 0 5px red, 0 0 10px orange;
        }
        @keyframes scrollHyper {
            0% { transform: translateX(0%);}
            100% { transform: translateX(-180%);}
        }
        .insanity-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: radial-gradient(circle, red, darkred);
            border: none;
            color: white;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 60px;
            cursor: pointer;
            z-index: 200;
            font-family: monospace;
            font-size: 1.2rem;
            box-shadow: 0 0 40px red;
            animation: shake 0.2s infinite;
            pointer-events: auto;
        }
        @keyframes shake {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(1px, -1px); }
            50% { transform: translate(-1px, 2px); }
            100% { transform: translate(0px, 0px); }
        }
        @media (max-width: 700px) {
            .pdf-epicenter { margin: 20px 15px; border-radius: 30px;}
            .mad-title { font-size: 1rem; letter-spacing: 2px; }
            .glitch-counter { font-size: 0.7rem; }
        }
        
        /* Стили для BSOD */
        .bsod-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0000aa;
            z-index: 100000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: white;
            text-align: center;
            animation: bsodFlicker 0.2s infinite;
            cursor: pointer;
        }
        @keyframes bsodFlicker {
            0% { opacity: 0.98; }
            100% { opacity: 1; }
        }
        .bsod-content {
            background: #0000aa;
            padding: 40px;
            border: 3px solid white;
            max-width: 80%;
            font-size: 24px;
        }
        .bsod-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 60px;
            font-weight: bold;
            color: white;
            background: red;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            font-family: Arial;
            transition: 0.2s;
            box-shadow: 0 0 20px red;
            z-index: 100001;
        }
        .bsod-close:hover {
            transform: scale(1.1);
            background: darkred;
        }
        .bsod-text {
            font-size: 28px;
            margin: 20px 0;
            white-space: pre-wrap;
        }
        .bsod-smile {
            font-size: 80px;
        }
    </style>
</head>
<body>

<div id="threeContainer" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;"></div>

<div class="main-ui">
    <div class="hyper-header">
        <div class="mad-title">🎧༼ຈل͜ຈ༽🎧 BASS CANNON • BSOD MODE • 8D HYPERSPACE 🎧༼ຈل͜ຈ༽🎧</div>
        <div class="glitch-counter">💀 СИНИЙ ЭКРАН КАЖДЫЕ 10С 💀</div>
    </div>
    <div class="pdf-epicenter">
        <iframe src="https://drive.google.com/file/d/1qg6g5xS8Z6FfneWJl-oMCgabFPdBYKzX/preview" allow="fullscreen"></iframe>
    </div>
    <div class="hyper-marquee">
        <div class="marquee-text">
            ⚡ СКРИПИЧНЫЙ КЛЮЧ = ГЛАВНЫЙ БАСС ⚡ 2-Я ЛИНЕЙКА СОЛЬ ФА ДО МИ ⚡ BSOD ВЫЛЕЗЕТ ЧЕРЕЗ 10 СЕКУНД ⚡ КЛИКАЙ ПО ЭКРАНУ — ВЗРЫВЫ ⚡ НЕ БОЙСЯ КРЕСТИКА ⚡
        </div>
    </div>
    <button class="insanity-btn" id="insanityButton">💥 ЕЩЁ БЕЗУМИЯ 💥</button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    
    const container = document.getElementById('threeContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.008);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 12);
    camera.lookAt(0, 0, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);
    
    const canvasTexture = document.createElement('canvas');
    canvasTexture.width = 1024;
    canvasTexture.height = 1024;
    const ctxTex = canvasTexture.getContext('2d');
    ctxTex.fillStyle = '#000000';
    ctxTex.fillRect(0, 0, canvasTexture.width, canvasTexture.height);
    ctxTex.font = 'Bold 90px "Courier New"';
    ctxTex.fillStyle = '#ff00ff';
    ctxTex.fillText('🎵', 100, 200);
    ctxTex.fillStyle = '#00ffff';
    ctxTex.fillText('♪', 400, 500);
    ctxTex.fillStyle = '#ffcc00';
    ctxTex.fillText('♫', 700, 800);
    ctxTex.fillStyle = '#ff3300';
    ctxTex.fillText('𝄞', 300, 700);
    for(let i=0;i<80;i++) {
        ctxTex.fillText(['🎵','♪','♫','🎶','𝄞','𝄢'][Math.floor(Math.random()*6)], Math.random()*1024, Math.random()*1024);
    }
    const texture = new THREE.CanvasTexture(canvasTexture);
    const cubeMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.2, metalness: 0.8, emissive: 0x220066 });
    const cube = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 2.2), cubeMat);
    cube.castShadow = true;
    scene.add(cube);
    
    const noteGroup = [];
    const colors = [0xff33cc, 0x33ffcc, 0xffaa33, 0x33ff33, 0xff44aa];
    for(let i=0; i<300; i++) {
        const geo = new THREE.SphereGeometry(0.07, 6, 6);
        const mat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*colors.length)], emissive: 0x441122, emissiveIntensity: 0.6 });
        const sphere = new THREE.Mesh(geo, mat);
        sphere.userData = {
            speedX: (Math.random() - 0.5) * 0.02,
            speedY: (Math.random() - 0.5) * 0.02,
            speedZ: (Math.random() - 0.5) * 0.02,
            range: 5 + Math.random() * 3
        };
        sphere.position.x = (Math.random() - 0.5) * 8;
        sphere.position.y = (Math.random() - 0.5) * 5;
        sphere.position.z = (Math.random() - 0.5) * 7 - 2;
        scene.add(sphere);
        noteGroup.push(sphere);
    }
    
    const particleCount = 2500;
    const particlesGeometry = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    for(let i=0; i<particleCount; i++) {
        particlePositions[i*3] = (Math.random() - 0.5) * 70;
        particlePositions[i*3+1] = (Math.random() - 0.5) * 40;
        particlePositions[i*3+2] = (Math.random() - 0.5) * 40 - 20;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMaterial = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.05, transparent: true, opacity: 0.5 });
    const particleSystem = new THREE.Points(particlesGeometry, particleMaterial);
    scene.add(particleSystem);
    
    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xffaaff, 1);
    mainLight.position.set(2, 5, 3);
    scene.add(mainLight);
    const backLight = new THREE.PointLight(0x3366ff, 0.8);
    backLight.position.set(-2, 1, -4);
    scene.add(backLight);
    const colorLight = new THREE.PointLight(0xff44cc, 0.6);
    colorLight.position.set(1, 2, 3);
    scene.add(colorLight);
    
    let time = 0;
    function animate3D() {
        requestAnimationFrame(animate3D);
        time += 0.012;
        cube.rotation.x = Math.sin(time * 0.3) * 0.5;
        cube.rotation.y = time * 0.5;
        cube.rotation.z = Math.sin(time * 0.2) * 0.3;
        
        noteGroup.forEach(ball => {
            ball.position.x += ball.userData.speedX;
            ball.position.y += ball.userData.speedY;
            ball.position.z += ball.userData.speedZ;
            if(Math.abs(ball.position.x) > ball.userData.range) ball.userData.speedX *= -1;
            if(Math.abs(ball.position.y) > ball.userData.range-1) ball.userData.speedY *= -1;
            if(Math.abs(ball.position.z) > ball.userData.range) ball.userData.speedZ *= -1;
            ball.scale.setScalar(0.8 + Math.sin(time*5 + ball.position.x)*0.3);
        });
        
        particleSystem.rotation.y += 0.002;
        particleSystem.rotation.x += 0.001;
        
        colorLight.intensity = 0.7 + Math.sin(time*3)*0.4;
        backLight.intensity = 0.5 + Math.cos(time*2.2)*0.3;
        renderer.render(scene, camera);
    }
    animate3D();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    function createExplosion(x, y) {
        for(let i=0;i<80;i++) {
            const dot = document.createElement('div');
            dot.style.position = 'fixed';
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
            dot.style.width = '6px';
            dot.style.height = '6px';
            dot.style.background = `hsl(${Math.random()*360}, 100%, 60%)`;
            dot.style.borderRadius = '50%';
            dot.style.pointerEvents = 'none';
            dot.style.zIndex = 9999;
            dot.style.boxShadow = '0 0 12px currentColor';
            document.body.appendChild(dot);
            const angle = Math.random() * Math.PI * 2;
            const velocity = 5 + Math.random() * 12;
            let vx = Math.cos(angle) * velocity;
            let vy = Math.sin(angle) * velocity;
            let opacity = 1;
            let lifetime = 0;
            const interval = setInterval(() => {
                lifetime++;
                x += vx;
                y += vy;
                vy += 0.3;
                opacity -= 0.03;
                dot.style.left = x + 'px';
                dot.style.top = y + 'px';
                dot.style.opacity = opacity;
                if(lifetime > 50 || opacity <= 0) {
                    clearInterval(interval);
                    dot.remove();
                }
            }, 20);
        }
    }
    
    document.body.addEventListener('click', (e) => {
        createExplosion(e.clientX, e.clientY);
        const r = Math.random() * 0.3 + 0.1;
        const g = Math.random() * 0.2;
        const b = Math.random() * 0.4 + 0.3;
        scene.background.setRGB(r, g, b);
        setTimeout(() => scene.background.setHex(0x050510), 300);
    });
    
    const insaneBtn = document.getElementById('insanityButton');
    insaneBtn.addEventListener('click', () => {
        let strobing = true;
        let count = 0;
        const interval = setInterval(() => {
            if(!strobing) return;
            document.body.style.backgroundColor = count % 2 === 0 ? 'white' : 'black';
            document.body.style.transition = '0.02s';
            count++;
            if(count > 20) {
                clearInterval(interval);
                document.body.style.backgroundColor = '';
            }
        }, 50);
        setTimeout(() => { strobing = false; }, 1000);
        
        try {
            const msg = new SpeechSynthesisUtterance("ВНИМАНИЕ! БЕЗУМИЕ ДОСТИГЛО КРИТИЧЕСКОЙ ОТМЕТКИ. СКРИПИЧНЫЙ КЛЮЧ РАЗРЫВАЕТ ПРОСТРАНСТВО.");
            msg.lang = 'ru-RU';
            msg.rate = 1.4;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(msg);
        } catch(e) {}
        
        const pdfDiv = document.querySelector('.pdf-epicenter');
        pdfDiv.style.transform = 'scale(1.02) rotate(1deg)';
        setTimeout(() => pdfDiv.style.transform = '', 150);
        
        for(let i=0;i<200;i++) {
            const fakeX = Math.random() * window.innerWidth;
            const fakeY = Math.random() * window.innerHeight;
            createExplosion(fakeX, fakeY);
        }
    });
</script>

<script>
    (function() {
        function showBSOD() {
            if (document.querySelector('.bsod-overlay')) return;
            
            const overlay = document.createElement('div');
            overlay.className = 'bsod-overlay';
            
            const closeBtn = document.createElement('div');
            closeBtn.className = 'bsod-close';
            closeBtn.innerHTML = '✕';
            closeBtn.onclick = function(e) {
                e.stopPropagation();
                overlay.remove();
            };
            
            const content = document.createElement('div');
            content.className = 'bsod-content';
            
            const smile = document.createElement('div');
            smile.className = 'bsod-smile';
            smile.innerHTML = '💀 🎵';
            
            const text = document.createElement('div');
            text.className = 'bsod-text';
            text.innerHTML = `:(\nСИНИЙ ЭКРАН СМЕРТИ\nСКРИПИЧНЫЙ КЛЮЧ ВЫЗВАЛ КРИТИЧЕСКУЮ ОШИБКУ\n\nSTOP CODE: MUSIC_KEY_OVERFLOW\n\nЕсли хотите продолжить — нажмите на красный крестик.`;
            
            const codeInfo = document.createElement('div');
            codeInfo.style.fontSize = '16px';
            codeInfo.style.marginTop = '30px';
            codeInfo.innerHTML = `*** STOP: 0x000000F4 (0xFFFFFFFF, 0xFFFFF788, 0x00000001, 0x00000000) ***`;
            
            content.appendChild(smile);
            content.appendChild(text);
            content.appendChild(codeInfo);
            overlay.appendChild(closeBtn);
            overlay.appendChild(content);
            
            overlay.onclick = function(e) {
                if (e.target === overlay) overlay.remove();
            };
            
            document.body.appendChild(overlay);
            
            if (navigator.vibrate) navigator.vibrate(200);
            
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);
                oscillator.frequency.value = 440;
                gain.gain.value = 0.3;
                oscillator.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                oscillator.stop(audioCtx.currentTime + 0.5);
                audioCtx.resume();
            } catch(e) {}
        }
        
        setInterval(() => {
            showBSOD();
        }, 28000);
        
        // Покажем первый экран через 2 секунды для эффекта
        setTimeout(showBSOD, 2000);
    })();
</script>
</body>
</html>
